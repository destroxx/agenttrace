# The checks run by hand before every commit (CLAUDE.md, "Commands"), plus the
# regression suite. A change to one must change the other.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read the code, nothing else. No job needs a token that can write, and no job
# uses a secret: the suite is offline by design, and the API job's database is
# a throwaway service container.
permissions:
  contents: read

# Every step runs as `bash --noprofile --norc -eo pipefail`. Without an explicit
# shell, GitHub runs steps as `bash -e`, with no pipefail -- and then
# `agenttrace run-suite ... | tee` reports tee's success, so a regressed case
# would turn CI green.
defaults:
  run:
    shell: bash

# A newer push to the same pull request makes the older run pointless. A push
# to main always finishes, so main's history has a result for every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # One version failing should not hide whether the other passes.
      fail-fast: false
      matrix:
        # requires-python = ">=3.12" claims both.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/python-sdk/pyproject.toml
      - name: Install
        run: pip install -e "packages/python-sdk[dev]" ruff
      - name: Test
        working-directory: packages/python-sdk
        run: pytest
      - name: Lint
        run: ruff check packages/python-sdk examples

  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # The same image as docker-compose.yml.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenttrace
          POSTGRES_USER: agenttrace
          # Not a secret: this database exists only for the length of the job.
          POSTGRES_PASSWORD: agenttrace-ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenttrace -d agenttrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Configured through the environment, not a .env file: app/config.py reads
    # both, and CI has no file to read.
    env:
      ENVIRONMENT: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: agenttrace
      POSTGRES_USER: agenttrace
      POSTGRES_PASSWORD: agenttrace-ci
      POSTGRES_TEST_DB: agenttrace_test
      # Without it, an unreachable database skips the integration tests and
      # the job passes having tested nothing. With it, that is a failure.
      RUN_INTEGRATION_TESTS: "1"
    defaults:
      run:
        shell: bash
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrations round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Test
        run: pytest -o addopts=""

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Next 16 needs >= 20.9.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      # Before tsc: the build generates the route types tsc checks.
      - name: Build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit

  regression-suite:
    name: Regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # AGENTTRACE_PROJECT_ID is deliberately unset: nothing uploads, which is
    # what proves the suite needs no API.
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python-sdk/pyproject.toml
      - name: Install the SDK only
        run: pip install -e packages/python-sdk
      - name: Replay demo
        # The demo fails itself if any real tool runs; this also pins the
        # four verdicts, so a comparison change that flips one is caught.
        run: |
          python examples/replay_demo.py | tee "$RUNNER_TEMP/demo.txt"
          expected="verdicts: v1 PASS · v2 FAIL · v3 FAIL · v4 PASS"
          if ! grep -Fxq "$expected" "$RUNNER_TEMP/demo.txt"; then
            echo "::error::replay_demo.py did not print: $expected"
            exit 1
          fi
      - name: Run the example suite
        # Runs even when the demo step failed: the two checks are independent,
        # and the suite's verdict is the one a reader needs on the summary page.
        if: ${{ !cancelled() }}
        # Exit 0 passes; 1 (a case regressed) and 2 (the suite could not run)
        # both fail the step, and the annotation says which. The summary is
        # written before exiting, so the verdict is on the run page either way.
        run: |
          status=0
          agenttrace run-suite examples/suites/support/suite.toml \
            --agent-version "${{ github.sha }}" 2>&1 | tee "$RUNNER_TEMP/suite.txt" || status=$?
          {
            echo "### Regression suite"
            echo '```'
            cat "$RUNNER_TEMP/suite.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) ;;
            1) echo "::error::a case regressed (exit 1)" ;;
            2) echo "::error::the suite could not run (exit 2)" ;;
            *) echo "::error::run-suite exited $status" ;;
          esac
          exit "$status"
