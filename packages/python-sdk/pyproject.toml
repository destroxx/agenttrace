[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Python SDK for AgentTrace — record AI-agent executions for replay-based regression testing."
readme = "README.md"
requires-python = ">=3.12"

# Deliberately dependency-free: the SDK is imported into user agent processes,
# so it must not constrain their dependency tree.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
